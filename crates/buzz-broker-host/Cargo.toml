[package]
name = "buzz-broker-host"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Durable host-owned authority for managed Buzz ACP runtimes"

[[bin]]
name = "buzz-broker-host"
path = "src/main.rs"

[dependencies]
axum = { workspace = true }
base64 = { workspace = true }
buzz-sdk = { workspace = true }
clap = { version = "4", features = ["derive"] }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sha2 = { workspace = true }
sqlx = { workspace = true, features = ["sqlite"] }
thiserror = { workspace = true }
tokio = { workspace = true }
uuid = { workspace = true }
zeroize = { workspace = true }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31", default-features = false, features = ["user"] }

[dev-dependencies]
buzz-broker-client = { workspace = true }
reqwest = { workspace = true }
tempfile = "3"
tower = { workspace = true }
